<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PharmaGest{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'medicament_liste' %}">💊 PharmaGest</a>
    <a class="nav-link text-white" href="{% url 'categorie_liste' %}">Catégories</a>
    <a class="btn btn-outline-light btn-sm" href="/admin/">Administration</a>
  </div>
</nav>
<div class="container">
  {% for message in messages %}
    <div class="alert alert-success">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
