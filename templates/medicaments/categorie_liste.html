{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h2>Catégories</h2>
  <a href="{% url 'categorie_ajouter' %}" class="btn btn-success">+ Ajouter</a>
</div>
<table class="table table-striped bg-white">
  <thead><tr><th>Nom</th><th>Description</th><th>Actions</th></tr></thead>
  <tbody>
  {% for c in categories %}
    <tr>
      <td>{{ c.nom }}</td>
      <td>{{ c.description|default:"—" }}</td>
      <td><a href="{% url 'categorie_modifier' c.pk %}" class="btn btn-sm btn-primary">Modifier</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="3" class="text-center">Aucune catégorie.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
