{% extends "base.html" %}
{% block content %}
<h2>Réception de marchandise</h2>
<form method="post" class="card card-body">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button class="btn btn-success">Valider la réception</button>
  <a href="{% url 'stock_apercu' %}" class="btn btn-link">Annuler</a>
</form>
{% endblock %}
